name: check

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- ${{ matrix.channel }}
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: moon version
        run: |
          moon version --all

      - name: moon check
        run: |
          moon update
          moon check --target all --deny-warn

      - name: moon info
        run: |
          moon info --target all
          git diff --exit-code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: moon test
        run: |
          moon test --target all -j 2
          moon test --target all --release -j 2
